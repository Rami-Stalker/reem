# Gradle picks the *last* value for a repeated key, so the 8G heap declared at
# the top of this file was being silently overridden by a 4G one further down,
# and `android.useAndroidX` was declared twice. One of each now.
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000

android.useAndroidX=true

# Jetifier rewrites the old android.support.* namespace inside every dependency
# on every build. It is off because there is nothing left to rewrite: the
# fourteen plugins this app actually ships are all AndroidX. Leaving it on costs
# minutes per clean build and buys nothing.
android.enableJetifier=false

# R8 in full mode — the shrinker Play expects a release to have been through.
android.enableR8.fullMode=true

org.gradle.parallel=true
org.gradle.caching=true
