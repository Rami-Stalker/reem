name: reem
description: "Ohara — a women's social marketplace: storefront, content, and wallet in one app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1

  # `@immutable` for domain entities. Flutter re-exports it from
  # `foundation.dart`, and reaching for it there is what made three domain
  # libraries import the framework — the one thing `domain/` must not do, and
  # the only enforced violation `check-flutter-boundaries` was reporting. The
  # annotation is pure Dart and lives here; the framework was never needed.
  meta: ^1.17.0

  # Navigation
  go_router: ^17.2.3

  # HTTP & Network
  dio: ^5.9.2
  web_socket_channel: ^3.0.3

  # Local storage. `hive` was declared here and never imported once; the app's
  # durable state is `flutter_secure_storage` for secrets, `shared_preferences`
  # for preferences, and a file-backed folder for the HTTP response cache.

  # Nineteen packages were declared here and never imported once. They were
  # not free: `flutter_stripe` drags the whole Stripe iOS/Android SDK in and
  # pins a minimum iOS version; `pay` obliges an Apple Pay entitlement and a
  # Google Pay merchant declaration; `google_sign_in` and `sign_in_with_apple`
  # need a URL scheme and an entitlement the project does not have, so they
  # were an App Store rejection waiting on a build that used them;
  # `local_auth` calls a Face ID API that crashes without an Info.plist key.
  # Every one of them also ships a privacy manifest Apple now audits. Removed
  # until something imports them:
  # flutter_stripe, pay, google_sign_in, sign_in_with_apple, local_auth,
  # photo_view, story_view, animations,
  # pull_to_refresh, flutter_spinkit, awesome_dialog, snippet_coder_utils,
  # glassmorphism, lottie, blur, like_button, flutter_svg,
  # font_awesome_flutter. `freezed` and `json_serializable` went with them:
  # both are build-time code generators that belonged in dev_dependencies,
  # there is no `build_runner` and not one generated file in the tree.

  # Firebase suite. Only the messaging half: Reem's identity is its own
  # (OTP over WhatsApp, device-anchored), its catalogue is Postgres and its
  # media is Supabase Storage, so `firebase_auth`, `cloud_firestore` and
  # `firebase_storage` would each be a second answer to a question already
  # answered.
  # firebase_auth: ^6.5.1
  # cloud_firestore: ^6.4.1
  # firebase_storage: ^13.4.1

  # Image/media
  image_picker: ^1.2.2
  # Verification documents. A commercial register often arrives as a PDF that
  # was never on the camera roll, and `image_picker` only ever offers photos —
  # so the documents pickers offer the file system as a third source.
  file_picker: ^12.1.0
  cached_network_image: ^3.4.1

  # UI widgets
  # Charts for the seller command centre (revenue / orders trend lines).
  fl_chart: ^1.2.0
  flutter_staggered_grid_view: ^0.7.0

  # Utilities & others
  get_it: ^9.2.1
  # Q55 — «يتصل بالزبونة بضغطة» and opening the address in a map. The
  # standard Flutter package for handing a URI to the OS.
  url_launcher: ^6.3.1
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  equatable: ^2.0.8
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1
  flutter_staggered_animations: ^1.1.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.0
  cryptography: ^2.9.0
  crypto: ^3.0.7

  # Voice notes. `record` writes AAC in an M4A container, which is what both
  # phone platforms produce natively and what the server's sniffer recognises;
  # `just_audio` plays one back from a URL with headers, which chat media needs
  # because its bytes sit behind an authorised endpoint.
  record: ^6.2.1
  just_audio: ^0.10.6
  # Where a voice note is written before it is uploaded. Already present
  # transitively (cached_network_image uses it); declared because this code
  # imports it directly.
  path_provider: ^2.1.6
  flutter_blurhash: ^0.9.1
  open_filex: ^4.7.0
  # Joining cache paths and taking the basename of a filename that arrived over
  # the network. Already present transitively; declared because this code
  # imports it directly.
  path: ^1.9.1
  # Handing a post or a product to WhatsApp — which is how Reem actually
  # travels between friends here. Opens the OS share sheet; the link it
  # carries is built from `AppEnv.shareBaseUrl`.
  share_plus: ^13.3.0
  # Reels, and a story that is a clip rather than a photograph.
  #
  # The project had no video player at all until this: `MediaType.video` was
  # modelled everywhere, accepted by the upload endpoint, and rendered as a
  # static poster with a play icon that did nothing — while a video story went
  # through `CachedNetworkImage` and simply failed to load.
  #
  # `video_player` was already here transitively; it is declared now because
  # this code imports it. `visibility_detector` is what makes a reels list
  # affordable: a controller is initialised only for the item actually on
  # screen and released when it leaves. See `DsVideoPlayer`.
  video_player: ^2.11.1
  visibility_detector: ^0.4.0+2

  # ── Push notifications ──────────────────────────────────────────────────
  #
  # The one capability the app was missing entirely: everything the platform
  # had to say was written into an in-app inbox and read only by whoever was
  # already looking — which is exactly the wrong audience for "your order is
  # out for delivery" or "someone replied to you".
  #
  # `firebase_messaging` is the only route to a closed app on Android and, via
  # APNs, on iOS. It carries `firebase_core` with it; nothing else from the
  # suite is here, deliberately — see above.
  #
  # `flutter_local_notifications` does two jobs FCM cannot. It creates the
  # Android notification channels (Android 8+ silently *discards* a push
  # naming a channel the device has not created, so without this every push
  # would arrive and vanish), and it draws the notification while the app is
  # in the foreground, where the system draws nothing at all.
  #
  # The manifest permissions that got this package removed before —
  # `SCHEDULE_EXACT_ALARM` and `RECEIVE_BOOT_COMPLETED`, both of which Play
  # asks a publisher to justify in writing — are removed again explicitly in
  # `android/app/src/main/AndroidManifest.xml`. Nothing here schedules a
  # notification for later, so neither is needed.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # Opens the OS notification settings page for this app.
  #
  # Needed because of a rule both platforms enforce: once she has said no to
  # notifications, the permission prompt never appears again. An in-app switch
  # that silently does nothing from then on is worse than no switch, so the
  # toggle sends her to the only place the decision can still be changed.
  app_settings: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Virtual time and a fake socket for the chat reconnection tests. Both were
  # already in the lock file through flutter_test and web_socket_channel.
  fake_async: ^1.3.3
  stream_channel: ^2.1.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Body / UI — supports Latin + Arabic (RTL). Variable weight axis 200–1000.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont.ttf
    # Display — elegant high-contrast serif for headings (Latin only; falls
    # back to Cairo for Arabic via DsTypography.fontFamilyFallback).
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont.ttf

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
