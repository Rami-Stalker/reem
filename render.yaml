# Reem API on Render — Blueprint (infrastructure as code).
#
# Render → New → Blueprint → this repository. Render reads this file, asks once
# for every `sync: false` value, and creates the service. No secret is written
# here. Checklist and reasoning: docs/DEPLOYMENT.md §Render Free.
#
#   Flutter ──HTTPS/WSS──▶ this service (NestJS) ──▶ Supabase: PostgreSQL + Storage
#
# FREE PLAN, for the trial and first launch. What that means, and what the code
# already does about each (none of it is a keep-awake trick):
#   - It sleeps after 15 minutes with no HTTP request or WebSocket message, and
#     the next request wakes it in about a minute. The app retries reads through
#     the wake-up and the chat socket reconnects on its own.
#   - Nothing runs while it sleeps. On waking, every overdue scheduled job runs
#     once (catch-up), shortest window first; each run is lease-locked in the
#     database. Exact-time work (a campaign at 18:00, a drop opening at 20:00)
#     happens at the next wake instead — see §Scheduled jobs on Free.
#   - Its disk is wiped on every sleep and deploy: uploads go to Supabase
#     Storage (MEDIA_DRIVER=supabase; production refuses a local disk).
#   - No pre-deploy command on Free: apply migrations before deploying with
#     `npm run db:pooled:deploy` (none are pending today).
#
# Moving to an always-on instance later is one line: `plan: starter`.

services:
  - type: web
    name: reem-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Beside the database: Supabase project `reem` is in eu-central-1.
    region: frankfurt
    plan: free
    branch: main
    # Every push to `branch` that touches the API deploys. (`checksPass` would
    # wait for CI, which is currently red on main for unrelated Flutter checks —
    # switch to it once CI is green.)
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    # Readiness: 200 only when the process is up AND PostgreSQL answers (503
    # otherwise). Not /health/jobs — after a sleep jobs are overdue for the
    # minute catch-up takes, and that must not fail a deploy or a restart.
    healthCheckPath: /health/ready
    # The container is started by the Dockerfile's CMD: `node dist/main.js`.
    # It binds 0.0.0.0:$PORT (Render provides PORT).
    envVars:
      # ── Fixed, not secret ──
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_FORMAT
        value: json
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: MEDIA_DRIVER
        value: supabase
      # The project's public address — not a key.
      - key: SUPABASE_URL
        value: https://huvtblxudachirsjaqkx.supabase.co
      # A free instance has a tenth of a CPU. Checkout's transaction is many
      # short round trips with JavaScript between them; Prisma's 5 s default
      # leaves no margin on a starved CPU.
      - key: DATABASE_TRANSACTION_TIMEOUT_MS
        value: "15000"
      - key: DATABASE_TRANSACTION_MAX_WAIT_MS
        value: "5000"

      # ── Database (Supabase transaction pooler) ──
      - key: DATABASE_URL
        sync: false

      # ── Supabase Storage, server-side only ──
      - key: SUPABASE_SECRET_KEY
        sync: false

      # ── Browser origins allowed to call the API (the native app sends none) ──
      - key: CORS_ORIGINS
        sync: false

      # MEDIA_PUBLIC_ORIGIN is optional here: when it is unset the API uses
      # RENDER_EXTERNAL_URL, which Render sets to https://<service>.onrender.com.
      # Add it in the Dashboard once a custom domain is attached.

      # ── Auth keyring: the EXISTING values from backend/.env — never new ones.
      # Every session, OTP digest and TOTP secret in the database was written
      # under these; new values sign everyone out and break every authenticator.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: GUEST_TOKEN_PEPPER
        sync: false
      - key: OTP_DELIVERY_KEY
        sync: false
      - key: TOTP_ENC_KEY
        sync: false

      # ── OTP delivery: production refuses to boot until one provider is
      # complete (SMS URL+key, or WhatsApp id+token, or voice URL+key). Leave
      # empty until a provider is contracted; add the others in the Dashboard
      # if WhatsApp or voice is the one chosen.
      - key: SMS_GATEWAY_URL
        sync: false
      - key: SMS_GATEWAY_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false

      # ── Temporary: fixed sign-in codes for the existing test accounts ──
      # Until a provider is contracted. `+phone:code` pairs, comma-separated,
      # only for accounts that already exist; nothing is sent to them. Needs
      # OTP_TEST_ACCOUNTS_UNTIL (ISO instant, at most 30 days out): past it the
      # codes stop working and production again refuses to boot without a
      # provider. Delete both once SMS/WhatsApp is live.
      - key: OTP_TEST_ACCOUNTS
        sync: false
      - key: OTP_TEST_ACCOUNTS_UNTIL
        sync: false

      # Enables POST /internal/jobs/:name/run (header X-Reem-Job-Secret) to run
      # a job on demand. Random, generated by Render; not an auth secret.
      - key: JOBS_TRIGGER_SECRET
        generateValue: true
