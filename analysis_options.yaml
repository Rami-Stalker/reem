# Static analysis for the Reem Flutter client.
#
# `flutter_lints` supplies the baseline. The additions below are the rules that
# keep the file layout honest: import hygiene, one obvious home per symbol, and
# a hard failure when a layer reaches somewhere it should not. Structural rules
# the analyzer cannot express -- domain must not import Flutter, presentation
# must not import Dio -- live in `tools/architecture/check-flutter-boundaries.mjs`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Regenerated by `flutter gen-l10n`; never hand-edited.
    - lib/l10n/app_localizations*.dart
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  errors:
    # An unreachable or duplicated import is how the last widget tree drifted
    # into a second copy of itself. Fail the build instead of accruing them.
    unused_import: error
    unnecessary_import: error
    duplicate_import: error
    directives_ordering: warning

  language:
    # `strict-casts` is green as of this commit: no implicit `dynamic` reaches a
    # typed parameter. `strict-raw-types` is deliberately left off -- it reports
    # 31 bare `Map`/`List` signatures in the data layer, which is real debt but
    # a separate change. Turn it on once those are annotated.
    strict-casts: true

linter:
  rules:
    # --- Import & file organization -----------------------------------------
    directives_ordering: true
    unnecessary_library_name: true
    implementation_imports: true

    # --- Correctness --------------------------------------------------------
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    no_adjacent_strings_in_list: true
    throw_in_finally: true
    unnecessary_statements: true
    use_build_context_synchronously: true

    # --- Consistency --------------------------------------------------------
    always_declare_return_types: true
    curly_braces_in_flow_control_structures: true
    prefer_final_locals: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    unawaited_futures: true
