name: Android APK

# Builds an installable release APK for testers, pointed at the deployed API.
# Download it from the run's "Artifacts" section and install it on the phone.
#
# Optional repository secrets:
#   GOOGLE_SERVICES_JSON_BASE64  base64 of android/app/google-services.json
#                                (without it the app builds, with no push)
#   ANDROID_KEYSTORE_BASE64      base64 of the release keystore, plus
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                                (without them the APK is signed with a debug
#                                key: fine for testing, not for the Play Store)
# Optional repository variable:
#   API_BASE_URL                 defaults to https://reem-api.onrender.com

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.8'

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    # Secrets cannot appear in a step's `if`; exposing them here lets the
    # optional steps below test for them.
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Firebase config (optional)
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Release keystore (optional)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build APK (one per processor)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://reem-api.onrender.com' }}
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          ls -lh build/app/outputs/flutter-apk/*.apk

      # Every phone from the last several years is arm64. The 32-bit one is
      # for old or very cheap devices.
      - uses: actions/upload-artifact@v4
        with:
          name: reem-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: reem-apk-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14

      # Needed to read a release crash stack trace (`flutter symbolize`).
      - uses: actions/upload-artifact@v4
        with:
          name: reem-debug-symbols
          path: build/symbols
          retention-days: 90
