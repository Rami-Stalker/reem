name: CI

# Nothing guarded this repository before. `flutter analyze`, `flutter test`,
# `tsc` and the backend suite were all green at the pre-launch audit — and the
# backend suite had, as far as anyone could tell, never been run: its
# integration specs open a real PrismaClient and skip in silence when no
# database answers. So this pipeline gives Postgres to the specs that need it,
# rather than letting them pass by not running.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.8'
  # Matches the production image and the lock file's npm (11).
  NODE_VERSION: '24'

jobs:
  flutter:
    name: Flutter — analyze, test, guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The generated localisations are committed, so a stale checkout would
      # analyze against strings the .arb files no longer describe.
      - name: Localisations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n \
            || (echo "::error::lib/l10n is stale — run 'flutter gen-l10n' and commit" && exit 1)

      - run: flutter analyze

      - run: flutter test

      # Structural checks the analyzer cannot express. All three reached zero
      # (layer boundaries, design-system components and spacing, and copy —
      # English and Arabic — living in the ARB bundles), so they now fail the
      # build: a regression is caught on the PR that introduces it.
      - name: Structural guards
        run: |
          node tools/architecture/check-flutter-boundaries.mjs
          node tools/architecture/check-design-system.mjs
          node tools/architecture/check-localization.mjs

      - name: No unreachable Dart
        run: node tools/architecture/find-unreachable-dart.mjs

  backend:
    name: Backend — typecheck, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reem_user
          POSTGRES_PASSWORD: reem_password
          POSTGRES_DB: reem_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # A throwaway database, never the developer's. The suite writes to it.
      DATABASE_URL: postgresql://reem_user:reem_password@localhost:5432/reem_test?schema=public
      NODE_ENV: test
      # Distinct, ≥32 characters, and none of them the published placeholders —
      # `env.validation.ts` refuses all three of those cases.
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-key-0001
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-key-002
      OTP_PEPPER: ci-otp-pepper-not-a-real-key-0000003
      GUEST_TOKEN_PEPPER: ci-guest-pepper-not-a-real-key-004
      OTP_DELIVERY_KEY: ci-delivery-key-not-a-real-key-0005
      TOTP_ENC_KEY: ci-totp-enc-key-not-a-real-key-0006
      MEDIA_PUBLIC_ORIGIN: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      # `migrate deploy`, never `db push`: the schema CI tests is the one the
      # migrations produce, which is the one production gets.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # `migrate status` only says every migration was applied. It cannot see
      # a model added to schema.prisma with no migration behind it — which is
      # how `customer_feedback` was missing from every database the migrations
      # built. The diff compares the database the migrations built with the
      # schema the code is compiled against, and fails on any difference.
      - name: Migrations match the schema
        run: |
          npx prisma migrate status
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
            || (echo "::error::schema.prisma and the migrations disagree — add a migration (npx prisma migrate dev)" && exit 1)

      # The integration specs assert on the demo world — a boutique with live
      # offers, a shopper with orders and favourites. Against the empty schema
      # above they failed by the hundred («the seeded shop has no live
      # offer»), which is why this job had been red since it was added.
      #
      # The seed deletes every row in every table, so it is confined to this
      # job's own service container: created empty for the run, discarded
      # after it. The case below refuses any other address, and the seed
      # itself refuses NODE_ENV=production.
      - name: Seed the throwaway test database
        run: |
          case "$DATABASE_URL" in
            postgresql://reem_user:*@localhost:5432/reem_test\?*) npm run db:seed ;;
            *) echo "Refusing to seed: DATABASE_URL is not this job's service container." >&2; exit 1 ;;
          esac

      - run: npx tsc --noEmit

      # No lint step. `package.json` has a `lint` script, but there is no
      # eslint config in the repository and eslint is not a dependency — the
      # script cannot run. Wiring CI to it would only ever produce a red build
      # that says "eslint: not found". Add the step when the config exists.

      - run: npm test

  api-image:
    name: Backend — production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image the host deploys (render.yaml → backend/Dockerfile). Built,
      # not pushed: a Dockerfile that only breaks on the host breaks at the
      # worst possible moment — during a deploy.
      - name: Build
        run: docker build --tag reem-api:ci backend

      - name: The image starts and refuses a bad environment
        run: |
          # No database or secrets here, so a healthy boot is not possible; what
          # is checked is that Node, Prisma and the compiled app load, and that
          # env validation — not a missing module — is what stops it.
          set +e
          docker run --rm -e NODE_ENV=production reem-api:ci > boot.log 2>&1
          set -e
          cat boot.log
          grep -q 'Invalid environment configuration' boot.log
